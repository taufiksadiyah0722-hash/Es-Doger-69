    <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemesanan Es Doger 69 Mas Opik</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fff0f5;
            color: #333;
        }
        .header-banner {
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: white;
            padding: 40px 0;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.3);
        }
        .card-form {
            border: none;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.15);
            background: white;
        }
        .product-box {
            background-color: #fff8fb;
            border: 1px solid #ffb6c1;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            font-weight: 600;
            border-radius: 50px;
            padding: 12px;
            transition: 0.3s;
            border: none;
        }
        .btn-whatsapp:hover {
            background-color: #1ebe57;
            color: white;
        }
        .form-label {
            color: #d81b60;
            font-weight: 600;
        }
        .alert-custom {
            font-size: 0.85rem;
            color: #c71585;
            background-color: #ffe4e1;
            border-color: #ffb6c1;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- Header Banner -->
    <div class="header-banner">
        <div class="container">
            <h1 class="fw-bold fs-3 mb-1">Es Doger 69 Mas Opik</h1>
            <p class="mb-0 fst-italic">"Segarnya Asli Indonesia"</p>
        </div>
    </div>

    <!-- Main Order Form Container -->
    <div class="container my-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card card-form p-4">
                    <h4 class="fw-bold text-center mb-4" style="color: #d81b60;">Formulir Pemesanan</h4>
                    <form id="orderForm">
                        
                        <!-- Nama -->
                        <div class="mb-3">
                            <label for="nama" class="form-label">Nama Lengkap</label>
                            <input type="text" class="form-control" id="nama" required placeholder="Masukkan nama Anda">
                        </div>

                        <!-- Status -->
                        <div class="mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status" required>
                                <option value="" selected disabled>-- Pilih Status --</option>
                                <option value="Karyawan GG">Karyawan GG</option>
                                <option value="Umum">Umum</option>
                            </select>
                        </div>

                        <!-- Pilihan Menu & Varian (Bisa Pilih Lebih dari 1) -->
                        <div class="mb-3">
                            <label class="form-label">Pilih Varian Es Doger (Bisa lebih dari 1)</label>
                            
                            <!-- Varian 1: Mini -->
                            <div class="product-box">
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" value="Mini 5K" id="checkMini" onchange="toggleProduct('Mini')">
                                    <label class="form-check-label fw-bold" for="checkMini" style="color: #c71585;">
                                        Mini - Rp 5.000 <span class="small fw-normal text-muted">(Cup 10 oz: Toping Es Doger, mutiara, tape, Roti)</span>
                                    </label>
                                </div>
                                <div id="optMini" class="row g-2 d-none mt-2">
                                    <div class="col-6">
                                        <label class="small text-muted">Jumlah Porsi</label>
                                        <input type="number" class="form-control form-control-sm" id="jmlMini" min="1" value="1">
                                    </div>
                                    <div class="col-6">
                                        <label class="small text-muted">Pilihan Susu</label>
                                        <select class="form-select form-select-sm" id="susuMini">
                                            <option value="Putih / Standar">Putih / Standar</option>
                                            <option value="Coklat">Coklat</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <!-- Varian 2: Standar -->
                            <div class="product-box">
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" value="Standar 8K" id="checkStandar" onchange="toggleProduct('Standar')">
                                    <label class="form-check-label fw-bold" for="checkStandar" style="color: #c71585;">
                                        Standar - Rp 8.000 <span class="small fw-normal text-muted">(Cup 14 oz: Toping Es Doger, mutiara, tape, roti, ketan hitam, jelly)</span>
                                    </label>
                                </div>
                                <div id="optStandar" class="row g-2 d-none mt-2">
                                    <div class="col-6">
                                        <label class="small text-muted">Jumlah Porsi</label>
                                        <input type="number" class="form-control form-control-sm" id="jmlStandar" min="1" value="1">
                                    </div>
                                    <div class="col-6">
                                        <label class="small text-muted">Pilihan Susu</label>
                                        <select class="form-select form-select-sm" id="susuStandar">
                                            <option value="Putih / Standar">Putih / Standar</option>
                                            <option value="Coklat">Coklat</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <!-- Varian 3: Spesial 69 -->
                            <div class="product-box">
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" value="Spesial 69 12K" id="checkSpesial" onchange="toggleProduct('Spesial')">
                                    <label class="form-check-label fw-bold" for="checkSpesial" style="color: #c71585;">
                                        Spesial 69 - Rp 12.000 <span class="small fw-normal text-muted">(Cup 16 oz: Toping Es Doger, mutiara, tape, roti, ketan hitam, extra jelly, keju)</span>
                                    </label>
                                </div>
                                <div id="optSpesial" class="row g-2 d-none mt-2">
                                    <div class="col-6">
                                        <label class="small text-muted">Jumlah Porsi</label>
                                        <input type="number" class="form-control form-control-sm" id="jmlSpesial" min="1" value="1">
                                    </div>
                                    <div class="col-6">
                                        <label class="small text-muted">Pilihan Susu</label>
                                        <select class="form-select form-select-sm" id="susuSpesial">
                                            <option value="Putih / Standar">Putih / Standar</option>
                                            <option value="Coklat">Coklat</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Lokasi Pengambilan -->
                        <div class="mb-3">
                            <label for="lokasi" class="form-label">Lokasi Pengambilan / Pengiriman</label>
                            <select class="form-select" id="lokasi" required onchange="checkDeliveryNote()">
                                <option value="" selected disabled>-- Pilih Lokasi --</option>
                                <option value="COD di depan kuburan Selowarih">COD di depan kuburan Selowarih</option>
                                <option value="Antar ke rumah">Antar ke rumah</option>
                                <option value="Ambil di kios kami">Ambil di kios kami</option>
                            </select>
                            <div id="deliveryNote" class="alert alert-warning alert-custom mt-2 p-2 d-none" role="alert">
                                ℹ️ Catatan: Layanan antar ke rumah minimal transaksi <b>Rp 24.000</b> per lokasi!
                            </div>
                        </div>

                        <!-- Kolom Alamat (Muncul Otomatis jika Antar ke Rumah) -->
                        <div class="mb-3 d-none" id="alamatContainer">
                            <label for="alamat" class="form-label">Alamat Lengkap Pengiriman</label>
                            <textarea class="form-control" id="alamat" rows="2" placeholder="Nama jalan, nomor rumah, RT/RW, patokan..."></textarea>
                        </div>

                        <!-- Jenis Pembayaran -->
                        <div class="mb-4">
                            <label for="pembayaran" class="form-label">Jenis Pembayaran</label>
                            <select class="form-select" id="pembayaran" required>
                                <option value="" selected disabled>-- Pilih Pembayaran --</option>
                                <option value="Tunai">Tunai</option>
                                <option value="QRIS">QRIS</option>
                            </select>
                        </div>

                        <!-- Tombol Submit -->
                        <button type="submit" class="btn btn-whatsapp w-100 py-2 shadow-sm">
                            📱 Kirim Pesanan via WhatsApp
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-4 text-muted small">
        <p class="mb-0">&copy; 2026 Es Doger 69 Mas Opik. All Rights Reserved.</p>
    </footer>

    <!-- Bootstrap JS & Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleProduct(name) {
            let checkbox = document.getElementById('check' + name);
            let optBox = document.getElementById('opt' + name);
            if (checkbox.checked) {
                optBox.classList.remove('d-none');
            } else {
                optBox.classList.add('d-none');
            }
        }

        function checkDeliveryNote() {
            let lokasi = document.getElementById('lokasi').value;
            let note = document.getElementById('deliveryNote');
            let alamatContainer = document.getElementById('alamatContainer');
            let alamatInput = document.getElementById('alamat');

            if (lokasi === 'Antar ke rumah') {
                note.classList.remove('d-none');
                alamatContainer.classList.remove('d-none');
                alamatInput.setAttribute('required', 'true');
            } else {
                note.classList.add('d-none');
                alamatContainer.classList.add('d-none');
                alamatInput.removeAttribute('required');
                alamatInput.value = '';
            }
        }

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();

            let nama = document.getElementById('nama').value;
            let status = document.getElementById('status').value;
            let lokasi = document.getElementById('lokasi').value;
            let alamat = document.getElementById('alamat').value || '-';
            let pembayaran = document.getElementById('pembayaran').value;

            // Cek produk yang dicentang
            let pesananList = [];
            let isMiniChecked = document.getElementById('checkMini').checked;
            let isStandarChecked = document.getElementById('checkStandar').checked;
            let isSpesialChecked = document.getElementById('checkSpesial').checked;

            if (!isMiniChecked && !isStandarChecked && !isSpesialChecked) {
                alert("Harap pilih minimal 1 varian Es Doger!");
                return;
            }

            if (isMiniChecked) {
                let jml = document.getElementById('jmlMini').value;
                let susu = document.getElementById('susuMini').value;
                pesananList.push(`- Mini (5K): ${jml} porsi (Susu: ${susu})`);
            }
            if (isStandarChecked) {
                let jml = document.getElementById('jmlStandar').value;
                let susu = document.getElementById('susuStandar').value;
                pesananList.push(`- Standar (8K): ${jml} porsi (Susu: ${susu})`);
            }
            if (isSpesialChecked) {
                let jml = document.getElementById('jmlSpesial').value;
                let susu = document.getElementById('susuSpesial').value;
                pesananList.push(`- Spesial 69 (12K): ${jml} porsi (Susu: ${susu})`);
            }

            let nomorWhatsApp = "6281332101747";

            let pesan = `Halo Kak Mas Opik, saya ingin memesan Es Doger:\n` +
                        `-----------------------------------\n` +
                        `- Nama: ${nama}\n` +
                        `- Status: ${status}\n` +
                        `Detail Pesanan:\n` + pesananList.join('\n') + `\n` +
                        `-----------------------------------\n` +
                        `- Lokasi: ${lokasi}\n`;

            if (lokasi === 'Antar ke rumah') {
                pesan += `- Alamat: ${alamat}\n`;
            }

            pesan += `- Pembayaran: ${pembayaran}\n` +
                     `-----------------------------------\n` +
                     `Mohon segera diproses ya, terima kasih!`;

            let urlWhatsApp = `https://api.whatsapp.com/send?phone=${nomorWhatsApp}&text=` + encodeURIComponent(pesan);
            window.location.href = urlWhatsApp;
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemesanan Es Doger 69 Mas Opik</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fff0f5;
            color: #333;
        }
        .header-banner {
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: white;
            padding: 40px 0;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.3);
        }
        .card-form {
            border: none;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.15);
            background: white;
        }
        .variant-info-box {
            background-color: #ffe4e1;
            border-left: 4px solid #ff69b4;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #8b008b;
            margin-top: 8px;
            display: none;
        }
        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            font-weight: 600;
            border-radius: 50px;
            padding: 12px;
            transition: 0.3s;
            border: none;
        }
        .btn-whatsapp:hover {
            background-color: #1ebe57;
            color: white;
        }
        .form-label {
            color: #d81b60;
            font-weight: 600;
        }
        .alert-custom {
            font-size: 0.85rem;
            color: #c71585;
            background-color: #ffe4e1;
            border-color: #ffb6c1;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- Header Banner -->
    <div class="header-banner">
        <div class="container">
            <h1 class="fw-bold fs-3 mb-1">Es Doger 69 Mas Opik</h1>
            <p class="mb-0 fst-italic">"Segarnya Asli Indonesia"</p>
        </div>
    </div>

    <!-- Main Order Form Container -->
    <div class="container my-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card card-form p-4">
                    <h4 class="fw-bold text-center mb-4" style="color: #d81b60;">Formulir Pemesanan</h4>
                    <form id="orderForm">
                        
                        <!-- Nama -->
                        <div class="mb-3">
                            <label for="nama" class="form-label">Nama Lengkap</label>
                            <input type="text" class="form-control" id="nama" required placeholder="Masukkan nama Anda">
                        </div>

                        <!-- Status -->
                        <div class="mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status" required>
                                <option value="" selected disabled>-- Pilih Status --</option>
                                <option value="Karyawan GG">Karyawan GG</option>
                                <option value="Umum">Umum</option>
                            </select>
                        </div>

                        <!-- Varian -->
                        <div class="mb-3">
                            <label for="varian" class="form-label">Varian Es Doger</label>
                            <select class="form-select" id="varian" required onchange="updateVariantInfo()">
                                <option value="" selected disabled data-desc="">-- Pilih Varian --</option>
                                <option value="Mini 5K" data-desc="Cup 10 oz dengan toping Es Doger, mutiara, tape, dan Roti. (Harga: Rp 5.000)">Mini - Rp 5.000</option>
                                <option value="Standar 8K" data-desc="Cup 14 oz dengan toping Es Doger, mutiara, tape, roti & jelly. (Harga: Rp 8.000)">Standar - Rp 8.000</option>
                                <option value="Spesial 69 12K" data-desc="Cup 16 oz dengan toping Es Doger, mutiara, tape, roti, extra jelly & keju. (Harga: Rp 12.000)">Spesial 69 - Rp 12.000</option>
                            </select>
                            <!-- Keterangan Varian -->
                            <div id="variantInfoBox" class="variant-info-box"></div>
                        </div>

                        <!-- Jumlah -->
                        <div class="mb-3">
                            <label for="jumlah" class="form-label">Jumlah Porsi</label>
                            <input type="number" class="form-control" id="jumlah" min="1" value="1" required>
                        </div>

                        <!-- Lokasi Pengambilan -->
                        <div class="mb-3">
                            <label for="lokasi" class="form-label">Lokasi Pengambilan / Pengiriman</label>
                            <select class="form-select" id="lokasi" required onchange="checkDeliveryNote()">
                                <option value="" selected disabled>-- Pilih Lokasi --</option>
                                <option value="COD di depan kuburan Selowarih">COD di depan kuburan Selowarih</option>
                                <option value="Antar ke rumah">Antar ke rumah</option>
                                <option value="Ambil di kios kami">Ambil di kios kami</option>
                            </select>
                            <div id="deliveryNote" class="alert alert-warning alert-custom mt-2 p-2 d-none" role="alert">
                                ℹ️ Catatan: Layanan antar ke rumah minimal transaksi <b>Rp 24.000</b> per lokasi!
                            </div>
                        </div>

                        <!-- Jenis Pembayaran -->
                        <div class="mb-4">
                            <label for="pembayaran" class="form-label">Jenis Pembayaran</label>
                            <select class="form-select" id="pembayaran" required>
                                <option value="" selected disabled>-- Pilih Pembayaran --</option>
                                <option value="Tunai">Tunai</option>
                                <option value="QRIS">QRIS</option>
                            </select>
                        </div>

                        <!-- Tombol Submit -->
                        <button type="submit" class="btn btn-whatsapp w-100 py-2 shadow-sm">
                            📱 Kirim Pesanan via WhatsApp
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-4 text-muted small">
        <p class="mb-0">&copy; 2026 Es Doger 69 Mas Opik. All Rights Reserved.</p>
    </footer>

    <!-- Bootstrap JS & Script WhatsApp Interactive Logic -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function updateVariantInfo() {
            let select = document.getElementById('varian');
            let infoBox = document.getElementById('variantInfoBox');
            let selectedOption = select.options[select.selectedIndex];
            let desc = selectedOption.getAttribute('data-desc');

            if (desc) {
                infoBox.innerHTML = "<b>Komposisi:</b> " + desc;
                infoBox.style.display = "block";
            } else {
                infoBox.style.display = "none";
            }
        }

        function checkDeliveryNote() {
            let lokasi = document.getElementById('lokasi').value;
            let note = document.getElementById('deliveryNote');
            if (lokasi === 'Antar ke rumah') {
                note.classList.remove('d-none');
            } else {
                note.classList.add('d-none');
            }
        }

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();

            let nama = document.getElementById('nama').value;
            let status = document.getElementById('status').value;
            let varian = document.getElementById('varian').value;
            let jumlah = document.getElementById('jumlah').value;
            let lokasi = document.getElementById('lokasi').value;
            let pembayaran = document.getElementById('pembayaran').value;

            // Nomor WhatsApp tujuan (Otomatis masuk ke 081332101747)
            let nomorWhatsApp = "6281332101747";

            let pesan = `Halo Mas Opik, saya ingin memesan Es Doger:%0A` +
                        `-----------------------------------%0A` +
                        `- Nama: ${nama}%0A` +
                        `- Status: ${status}%0A` +
                        `- Varian: ${varian}%0A` +
                        `- Jumlah: ${jumlah} porsi%0A` +
                        `- Lokasi: ${lokasi}%0A` +
                        `- Pembayaran: ${pembayaran}%0A` +
                        `-----------------------------------%0A` +
                        `Mohon segera diproses ya, terima kasih!`;

            let urlWhatsApp = `https://wa.me/${nomorWhatsApp}?text=${pesan}`;
            
            // Membuka WhatsApp secara langsung
            window.location.href = urlWhatsApp;
        });
    </script>
</body>
</html>
